aid: pdi-technologies-fka-pdi-software
name: PDI Technologies (fka PDI Software)
description: >-
  PDI Technologies (formerly PDI Software) is a global provider of software and
  data solutions for the convenience retail and wholesale petroleum industries,
  serving 200,000+ customers across 60+ countries. Its portfolio spans PDIQ (an
  AI foundation for convenience and fuel operations), PDI Enterprise wholesale
  petroleum software, ERP and back-office systems, POS and store systems,
  logistics, loyalty marketing, fuel and mobility payments, an offer network,
  insights and analytics, cybersecurity (PDI Security and Network Solutions,
  formerly Echosat), and the consumer app GasBuddy. PDI is backed by Insight
  Partners and has grown through acquisitions including P97 Networks. The
  company exposes no public self-serve developer/API portal; this profile was
  added to the API Evangelist network as an enrichment lead.
